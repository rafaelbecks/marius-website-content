# Pre-built static site. GitHub Actions publishes this folder; Netlify does not build it.

[build]
  publish = "."

[[redirects]]
  from = "/projects/:slug"
  to = "/projects/:slug/"
  status = 301

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
