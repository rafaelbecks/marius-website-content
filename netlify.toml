# Optional: build this repo on Netlify.
# The live site is published by .github/workflows/publish-site.yml into the static repo.

[build]
  base = "marius-web"
  publish = "out"
  command = "npm run build:static"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
